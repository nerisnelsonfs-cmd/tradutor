<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tradutor</title>
<meta name="theme-color" content="#05080f">
<style>
  :root{
    --fundo:#05080f; --sup:#0c1421; --sup2:#111c2e; --borda:#1e3350;
    --neon:#00f0ff; --texto:#eaf4ff; --texto2:#8fa8c4;
    --ok:#22e07a; --erro:#ff5470; --aviso:#ffb020; --esc:1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(900px 560px at 50% -14%,rgba(0,240,255,.10),transparent 62%),var(--fundo);
    color:var(--texto); font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    min-height:100vh; padding:18px 15px 34px; font-size:calc(18px*var(--esc)); line-height:1.55;
  }
  .caixa{max-width:680px;margin:0 auto}

  header{display:flex;align-items:center;gap:13px;margin-bottom:4px}
  .marca{width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--neon),#0a7ea4);display:grid;place-items:center;
    font-size:24px;box-shadow:0 0 22px rgba(0,240,255,.4)}
  h1{margin:0;font-size:1.3em;letter-spacing:.4px;
    background:linear-gradient(90deg,var(--neon),#7fe7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--texto2);font-size:.82em;margin:2px 0 20px}

  .painel{background:linear-gradient(180deg,var(--sup),var(--sup2));border:1px solid var(--borda);
    border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 16px 40px rgba(0,0,0,.44)}

  /* ---- o grande botao de ligar ---- */
  .ligar{
    width:100%; min-height:96px; border-radius:16px; border:none; cursor:pointer;
    font-family:inherit; font-size:1.22em; font-weight:900; letter-spacing:1px;
    background:linear-gradient(135deg,var(--neon),#0a7ea4); color:#04121b;
    box-shadow:0 10px 30px rgba(0,240,255,.32);
    display:flex;align-items:center;justify-content:center;gap:12px;
    transition:transform .12s,filter .18s;
  }
  .ligar:active{transform:scale(.98)}
  .ligar.on{background:linear-gradient(135deg,#22e07a,#0a8a4a); box-shadow:0 10px 30px rgba(34,224,122,.3)}
  .ligar:focus-visible{outline:3px solid #fff;outline-offset:3px}

  /* ---- estado ---- */
  .estado{margin-top:14px;padding:15px 17px;border-radius:12px;background:#060c16;
    border:1px solid var(--borda);display:flex;align-items:center;gap:13px;min-height:66px}
  .bolinha{width:14px;height:14px;border-radius:50%;background:#33455e;flex:0 0 auto;transition:.2s}
  .bolinha.ouvindo{background:var(--neon);box-shadow:0 0 14px var(--neon);animation:p 2s ease-in-out infinite}
  .bolinha.lendo{background:var(--ok);box-shadow:0 0 14px var(--ok);animation:p 1.2s ease-in-out infinite}
  .bolinha.erro{background:var(--erro);box-shadow:0 0 14px var(--erro)}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.28}}
  .estado b{display:block;font-size:.96em}
  .estado small{color:var(--texto2);font-size:.79em}

  /* ---- o texto que ela esta lendo ---- */
  .recado{
    margin-top:14px;padding:16px;border-radius:12px;background:#060c16;
    border:1px solid var(--borda); max-height:290px; overflow-y:auto;
    font-size:.95em; line-height:1.7; color:#cfe4f5; white-space:pre-wrap;
    display:none;
  }
  .recado.on{display:block}
  .recado:empty{display:none}

  .botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
  .botoes button{
    font-family:inherit;font-size:.94em;font-weight:800;letter-spacing:.6px;
    padding:15px 12px;border-radius:12px;border:1px solid var(--borda);
    background:#0e1a2b;color:var(--texto);cursor:pointer;min-height:56px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  }
  .botoes button:hover:not(:disabled){border-color:var(--neon);background:#12263c}
  .botoes button:disabled{opacity:.4;cursor:not-allowed}
  .botoes button:focus-visible{outline:3px solid var(--neon);outline-offset:3px}

  .linha{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:14px}
  .linha>span{font-size:.79em;color:var(--texto2);font-weight:800;letter-spacing:.6px}
  .chip{padding:9px 14px;border-radius:99px;border:1px solid var(--borda);background:#0a1523;
    color:var(--texto2);cursor:pointer;font-size:.84em;font-weight:800;min-height:44px;
    display:flex;align-items:center;font-family:inherit}
  .chip.ativo{background:rgba(0,240,255,.15);border-color:var(--neon);color:var(--neon)}
  .letras{margin-left:auto;display:flex;gap:7px}
  .letras button{min-height:44px;padding:9px 14px;border-radius:10px;border:1px solid var(--borda);
    background:#0e1a2b;color:var(--texto);font-weight:800;cursor:pointer;font-family:inherit}

  .dica{margin-top:16px;padding:14px 16px;border-radius:12px;
    background:rgba(0,240,255,.055);border:1px solid rgba(0,240,255,.2);
    font-size:.86em;color:#bfe6f5;line-height:1.65}
  .dica b{color:var(--neon)}
  kbd{background:#0a1523;border:1px solid var(--borda);border-bottom-width:2px;border-radius:6px;
    padding:2px 8px;font-weight:800;font-size:.9em}
  /* ---- escuta continua (v3.0) ---- */
  .escuta{
    width:100%; min-height:72px; margin-top:12px; border-radius:14px; cursor:pointer;
    font-family:inherit; font-size:1.05em; font-weight:900; letter-spacing:.8px;
    background:#0e1a2b; color:var(--texto); border:2px solid var(--neon);
    display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s;
  }
  .escuta:hover{background:#12263c}
  .escuta.on{background:linear-gradient(135deg,#22e07a,#0a8a4a);border-color:#22e07a;color:#04121b}
  .escuta.pausada{background:linear-gradient(135deg,#ffb020,#b57400);border-color:#ffb020;color:#1b1000}
  .escuta:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .escuta:disabled{opacity:.4;cursor:not-allowed}
  .ouvi{margin-top:10px;padding:12px 15px;border-radius:12px;background:#060c16;
    border:1px solid var(--borda);font-size:.9em;color:#cfe4f5;min-height:48px;display:none}
  .ouvi.on{display:block}
  .ouvi b{color:var(--neon)}
  .ouvi.enviado b{color:var(--ok)}
  .ouvi.erro b{color:var(--erro)}
  .ouvi.ignorado{color:#8fa8c4}
  .cron{margin-top:10px;padding:12px 15px;border-radius:12px;background:#060c16;
    border:1px solid var(--borda);font-size:.9em;color:#cfe4f5;display:none}
  .cron.on{display:block}
  .cron b{color:var(--aviso)}
  .cron small{display:block;color:var(--texto2);font-size:.86em;margin-top:3px}
  .ouvi.ignorado b{color:#8fa8c4}
  .nota-voz{margin:8px 0 0;font-size:.82em;color:#9fb6cf;line-height:1.5}
  /* ---- palavra de chamada e ajuda ---- */
  .palavra{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--borda);
    background:#060c16;color:var(--texto);font-family:inherit;font-size:.9em;width:11em;max-width:100%}
  .palavra:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
  .palavra:disabled{opacity:.45}
  .ajuda{margin-top:16px;padding:6px 16px;border-radius:12px;background:#0c1421;border:1px solid var(--borda)}
  .ajuda summary{cursor:pointer;font-weight:800;padding:12px 0;min-height:44px;color:var(--neon)}
  .ajuda summary:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
  .ajuda ol{padding-left:1.3em;margin:4px 0 12px}
  .ajuda li{margin:8px 0}
  .ajuda p{font-size:.92em;color:#cfe4f5}
  .ajuda b{color:#eaf4ff}
  footer{text-align:center;color:#516b8a;margin-top:24px;font-size:.76em}
  @media(max-width:520px){ .botoes{grid-template-columns:1fr} }
</style><style>
  /* ---- idioma (v1.2) ---- */
  .idioma{display:flex;gap:6px;margin-left:auto}
  .idioma .chip{min-height:44px;padding:8px 12px;font-size:.8em}
  header{flex-wrap:wrap}
  /* ---- escolha da voz (v1.3) ---- */
  .voz-sel{min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--borda);
    background:#060c16;color:var(--texto);font-family:inherit;font-size:.9em;max-width:100%;flex:1 1 12em}
  .voz-sel:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
</style>
</head>
<body>
<div class="caixa">

  <header>
    <div class="marca" aria-hidden="true">🎧</div>
    <div><h1>TRADUTOR</h1></div>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button class="chip" data-lang="pt" aria-pressed="false">Português</button>
      <button class="chip" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>
  <p class="sub" data-th="sub"></p>

  <div class="painel">
    <button class="ligar" id="btnLigar"></button>

    <div class="estado">
      <div class="bolinha" id="bolinha"></div>
      <div>
        <b id="eTxt"></b>
        <small id="eSub"></small>
      </div>
    </div>

    <button class="escuta" id="btnEscuta" aria-pressed="false"></button>
    <div class="ouvi" id="ouvi" aria-live="polite"></div>
    <div class="cron" id="cron"></div>

    <div class="linha">
      <span data-t="palavraRotulo"></span>
      <input id="palavra" class="palavra" type="text" maxlength="30" autocomplete="off" spellcheck="false">
    </div>
    <p class="nota-voz" id="notaChamada"></p>

    <p class="nota-voz" data-t="notaEnviar"></p>

    <div class="recado" id="recado"></div>

    <div class="botoes">
      <button id="btnRepetir" disabled></button>
      <button id="btnParar" disabled></button>
    </div>

    <div class="linha">
      <span data-t="vozRotulo"></span>
      <select id="voz" class="voz-sel"></select>
      <button class="chip" id="btnOuvirVoz" data-t="ouvirVoz"></button>
    </div>

    <div class="linha">
      <span data-t="velocidade"></span>
      <button class="chip" data-v="0.85" aria-pressed="false" data-t="devagar"></button>
      <button class="chip ativo" data-v="1" aria-pressed="true" data-t="normal"></button>
      <button class="chip" data-v="1.25" aria-pressed="false" data-t="rapido"></button>
      <div class="letras">
        <button id="menos">A−</button><button id="mais">A+</button>
      </div>
    </div>
    <p class="nota-voz" id="notaVoz"></p>
  </div>

  <details class="ajuda">
    <summary data-t="ajudaTitulo"></summary>
    <div data-th="ajuda"></div>
  </details>

  <footer>Tradutor v1.8 · Neris · Equipe Porta Aberta IA</footer>
</div>

        f = f.slice(corte).trim();
      }
      if ((acc + ' ' + f).trim().length <= LIMITE) acc = (acc + ' ' + f).trim();

  function prepararBip(){

  function bip(){
    try {
      prepararBip(); if (!ctxBip) return;
      var o = ctxBip.createOscillator(), g = ctxBip.createGain(), t0 = ctxBip.currentTime;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g); g.connect(ctxBip.destination); o.start(t0); o.stop(t0 + 0.2);
    } catch(e){}
  }
  function armar(){
    armadoAte = Date.now() + ESPERA_RECADO;
    bip();
    ouvi('', t('podeFalar'));
    clearTimeout(timerArmado);
    timerArmado = setTimeout(function(){
      if (armadoAte && Date.now() >= armadoAte){
        armadoAte = 0;
        ouvi('ignorado', t('naoOuvi', {p: escapar(palavra)}));
      }
    }, ESPERA_RECADO + 200);
  }

  function fecharFrase(){
    var texto = juntando.trim();
    juntando = '';
    if (!texto) return;
    var comChamada = RE_CHAMADA.test(texto);
    var resto = comChamada ? texto.replace(RE_CHAMADA, '').trim() : texto;
    if (!comChamada && armadoAte && Date.now() < armadoAte){ comChamada = true; resto = texto; }
    if (resto){ armadoAte = 0; clearTimeout(timerArmado); }
    if (T[lang].parar.test(resto)){ desligarEscuta(t('disseParar')); return; }
    if (!comChamada){ ouvi('ignorado', '<b>' + t('ignoradoSem', {p: escapar(palavra)}) + '</b> ' + escapar(texto)); return; }
    if (!resto){ armar(); return; }
    // "hum", "ah", "é" não vão. "sim" e "não" VÃO (são resposta!).
    if (resto.replace(/[^\p{L}\p{N}]/gu, '').length < 2 || RE_HESITA.test(resto)){
      ouvi('ignorado', '<b>' + t('ignoradoCurto') + '</b> ' + escapar(resto));
      return;
    }
    enviarFala(resto.charAt(0).toUpperCase() + resto.slice(1));
  }

  function enviarFala(texto){
    tFala = tUltimaPalavra || Date.now(); tChegou = 0;
    ouvi('', '<b>' + t('enviando') + '</b> ' + escapar(texto));
    fetch('/fala', {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({texto: texto})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok){ ouvi('enviado', '<b>' + t('noCaixa') + '</b> ' + escapar(texto)); avisoFalado(t('faladoColada')); return; }
        tFala = 0;
        var msg = (d && d.codigo && T[lang].erros[d.codigo]) || T[lang].erros.outro;
        ouvi('erro', '<b>' + escapar(msg) + '</b> ' + t('suaFrase') + ' ' + escapar(texto));
        avisoFalado(msg);
      })
      .catch(function(){
        tFala = 0;
        ouvi('erro', t('semPrograma2'));
        avisoFalado(t('semPrograma2').replace(/<[^>]+>/g, ''));
      });
  }

  /* v1.8 (15/10/2026): quem não enxerga a tela não sabia se a frase tinha ido pra
     caixa do Cowork. Agora o Tradutor AVISA em voz alta ("Frase na caixa. Aperte
     Enter para mandar.") — e também fala o erro, se não deu. A escuta fica
     pausada enquanto ele fala, pra não ouvir a própria voz. Se uma resposta do
     Claude estiver sendo lida, o aviso não entra: nada é cortado. */
  function avisoFalado(texto){
    if (!temVoz || tocando || !texto) return;
    try {
      pausarEscuta();
      var u = frase(texto), voltou = false;
      var voltar = function(){ if (voltou) return; voltou = true; retomarEscuta(400); };
      u.onend = voltar; u.onerror = voltar;
      setTimeout(voltar, 8000);   // vigia: a voz travou? a escuta volta mesmo assim
      try { speechSynthesis.resume(); } catch(e){}
      speechSynthesis.speak(u);
    } catch(e){ retomarEscuta(400); }
  }

  /* 29/09/2026 (Neris: "ficar pra lá e pra cá desconcentra a gente"): enquanto a escuta
     estiver ligada, o microfone fica SEGURO aberto. O reconhecimento de voz do Chrome solta
     e pega o microfone a cada pausa e toda vez que a voz lê; a cada vez o Windows mostrava e
     escondia o ícone do microfone, e os ícones da barra de tarefas andavam pro lado.
     Segurar NÃO grava nada: o som não vai pra lugar nenhum, só mantém o aviso parado.
     Sem permissão ou sem microfone: segue do jeito de antes. */
  var micPreso = null, micPedindo = false;
  function segurarMic(){
    if (micPreso || micPedindo) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    micPedindo = true;
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
      .then(function(s){
        micPedindo = false;
        if (!escutaLigada){ s.getTracks().forEach(function(tr){ tr.stop(); }); return; }
        micPreso = s;
      })
      .catch(function(){ micPedindo = false; });
  }
  function soltarMic(){
    if (!micPreso) return;
    try { micPreso.getTracks().forEach(function(tr){ tr.stop(); }); } catch(e){}
    micPreso = null;
  }

  function desligarEscuta(motivo, erro){
    escutaLigada = false;
    soltarMic();
    clearTimeout(timerEnvio); clearTimeout(timerVolta);
    if (juntando) fecharFrase();
    if (rec){ try { rec.abort(); } catch(e){} }
    recAtivo = false;
    botaoEscuta();
    if (motivo) ouvi(erro ? 'erro' : '', (erro ? '<b>' + t('atencao') + '</b> ' : '') + escapar(motivo));
  }

  if (!temEscuta){ btnEscuta.disabled = true; }

  btnEscuta.addEventListener('click', function(){
    if (!temEscuta) return;
    if (escutaLigada){ desligarEscuta(t('escutaOff')); return; }
    escutaLigada = true;
    segurarMic();
    prepararBip();
    if (!ligada) btnLigar.click();          // a resposta precisa de alguém pra ler
    ouvi('', t('escutaOn', {p: escapar(palavra)}));
    botaoEscuta();
    retomarEscuta(1500);                    // deixa o "ligado" terminar antes de ouvir
  });

  /* ================= IDIOMA =================
     Troca tudo: textos da tela, voz que lê, idioma que escuta e palavra de chamada. */
  function aplicarIdioma(){
    document.documentElement.lang = T[lang].htmlLang;
    document.querySelectorAll('[data-t]').forEach(function(x){ x.textContent = t(x.dataset.t); });
    document.querySelectorAll('[data-th]').forEach(function(x){ x.innerHTML = t(x.dataset.th); });
    document.querySelectorAll('.idioma .chip').forEach(function(x){
      var on = x.dataset.lang === lang;
      x.classList.toggle('ativo', on); x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    btnLigar.innerHTML = t(ligada ? 'ligado' : 'ligar');
    btnRepetir.innerHTML = t('repetir'); btnParar.innerHTML = t('parar2');
    $('menos').setAttribute('aria-label', t('menos')); $('mais').setAttribute('aria-label', t('mais'));
    inPalavra.setAttribute('aria-label', t('palavraRotulo'));
    $('notaVoz').textContent = t(temVoz ? 'notaVoz' : 'notaVozSem');
    estado(estadoAtual[0], estadoAtual[1], estadoAtual[2], estadoAtual[3]);
    carregarPalavra(); mostrarChamada();
    montarVozes();
    if (!temVoz){ selVoz.disabled = true; $('btnOuvirVoz').disabled = true; }
    botaoEscuta();
    if (!temEscuta) ouvi('erro', t('escutaSemNav'));
    // A escuta já ligada precisa recomeçar no idioma novo.
    if (rec){ try { rec.abort(); } catch(e){} rec = null; recAtivo = false; retomarEscuta(300); }
  }
  document.querySelectorAll('.idioma .chip').forEach(function(c){
    c.addEventListener('click', function(){
      if (c.dataset.lang === lang) return;
      lang = c.dataset.lang; guardar('trad_lang', lang);
      aplicarIdioma();
    });
  });
  aplicarIdioma();

  /* a aba dormiu e voltou: espia na hora */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && ligada && !pedindo){ descanso = 0; proximaEspiada(); }
  });

})();
</script>
